<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD 编辑器</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/editor.css" />
  <link rel="stylesheet" href="./styles/themes/light.css" id="theme-light" />
  <link rel="stylesheet" href="./styles/themes/dark.css" id="theme-dark" disabled />
  <link rel="stylesheet" href="./styles/sidebar.css" />
  <link rel="stylesheet" href="./styles/tabs.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部标题栏 -->
    <div id="titlebar">
      <div class="titlebar-left">
        <span class="app-title">📝 MD 编辑器</span>
      </div>
      <div class="titlebar-center">
        <span id="current-file-name">未命名</span>
      </div>
      <div class="titlebar-right">
        <button id="btn-new" title="新建 (Ctrl+N)">＋</button>
        <button id="btn-open" title="打开 (Ctrl+O)">📂</button>
        <button id="btn-save" title="保存 (Ctrl+S)">💾</button>
        <button id="btn-export" title="导出">⤓</button>
        <button id="btn-theme" title="切换主题">🎨</button>
        <button id="btn-outline" title="大纲">☰</button>
        <button id="btn-sidebar" title="侧边栏">📑</button>
        <button id="btn-customcss" title="自定义 CSS">⚙</button>
        <button id="btn-git" title="Git 面板 (Ctrl+Shift+G)">⎇</button>
        <button id="btn-graph" title="文档图谱">🕸</button>
        <button id="btn-publish" title="一键发布">📤</button>
      </div>
    </div>

    <div id="main">
      <!-- 文件树侧边栏 -->
      <div id="sidebar">
        <div class="sidebar-header">
          <span>文件</span>
        </div>
        <div id="file-tree"></div>
      </div>

      <!-- 标签页 -->
      <div id="tab-bar"></div>

      <!-- 编辑区 -->
      <div id="editor-container">
        <div id="editor" contenteditable="true" spellcheck="false"></div>
      </div>

      <!-- 大纲面板 -->
      <div id="outline">
        <div class="sidebar-header">
          <span>大纲</span>
        </div>
        <div id="outline-list"></div>
      </div>
    </div>

    <!-- 右键上下文菜单 -->
    <div id="ctx-menu" class="ctx-menu hidden">
      <div class="ctx-item" data-action="copy-html">复制为 HTML</div>
      <div class="ctx-item" data-action="copy-text">复制为纯文本</div>
      <div class="ctx-item" data-action="copy-md">复制 Markdown 源码</div>
    </div>

    <!-- 全局搜索面板 -->
    <div id="search-panel" class="search-panel hidden">
      <div class="search-header">
        <input type="text" id="search-input" placeholder="在工作区搜索内容（支持正则）..." />
        <label class="search-regex"><input type="checkbox" id="search-use-regex" /> 正则</label>
        <button id="search-close" class="search-close">✕</button>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>

    <!-- 自定义 CSS 弹窗 -->
    <div id="css-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <span>自定义 CSS（覆盖默认渲染样式）</span>
          <button id="css-close" class="search-close">✕</button>
        </div>
        <textarea id="css-editor" class="css-textarea" placeholder="#editor h1 { color: red; }&#10;#editor p { font-size: 18px; }" spellcheck="false"></textarea>
        <div class="modal-footer">
          <button id="css-reset" class="modal-btn">重置</button>
          <button id="css-apply" class="modal-btn primary">应用</button>
        </div>
      </div>
    </div>

    <!-- Git 面板 -->
    <div id="git-panel" class="search-panel hidden">
      <div class="search-header">
        <span id="git-branch" class="git-branch-label">分支: -</span>
        <button id="git-refresh" class="modal-btn" style="padding:4px 8px;font-size:12px">刷新</button>
        <button id="git-close" class="search-close">✕</button>
      </div>
      <div class="git-section-title">变更文件</div>
      <div id="git-files" class="git-files"></div>
      <div class="git-section-title">提交信息</div>
      <textarea id="git-message" class="git-message" placeholder="提交信息..."></textarea>
      <div class="git-actions">
        <button id="git-stage-all" class="modal-btn">全部暂存</button>
        <button id="git-commit-btn" class="modal-btn">提交</button>
        <button id="git-push-btn" class="modal-btn primary">推送</button>
      </div>
      <div class="git-section-title">最近提交</div>
      <div id="git-log" class="git-log"></div>
    </div>

    <!-- 文档关系图谱弹窗 -->
    <div id="graph-modal" class="modal hidden">
      <div class="modal-content" style="width:760px">
        <div class="modal-header">
          <span>文档关系图谱（[[双向链接]]）</span>
          <button id="graph-close" class="search-close">✕</button>
        </div>
        <div style="position:relative;height:480px;padding:8px">
          <svg id="graph-svg" width="100%" height="100%"></svg>
          <div id="graph-empty" class="search-empty" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">无文档或无双向链接</div>
        </div>
      </div>
    </div>

    <!-- 状态栏 -->
    <div id="statusbar">
      <span id="status-info">就绪</span>
      <span id="status-stats">0 字 · 0 词</span>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
