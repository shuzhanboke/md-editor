<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD 编辑器</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/editor.css" />
  <link rel="stylesheet" href="./styles/themes/light.css" id="theme-light" />
  <link rel="stylesheet" href="./styles/themes/dark.css" id="theme-dark" disabled />
  <link rel="stylesheet" href="./styles/sidebar.css" />
  <link rel="stylesheet" href="./styles/tabs.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部标题栏 -->
    <div id="titlebar">
      <div class="titlebar-left">
        <span class="app-title">📝 MD 编辑器</span>
      </div>
      <div class="titlebar-center">
        <span id="current-file-name">未命名</span>
      </div>
      <div class="titlebar-right">
        <button id="btn-new" title="新建 (Ctrl+N)">＋</button>
        <button id="btn-open" title="打开 (Ctrl+O)">📂</button>
        <button id="btn-save" title="保存 (Ctrl+S)">💾</button>
        <button id="btn-export" title="导出">⤓</button>
        <button id="btn-theme" title="切换主题">🎨</button>
        <button id="btn-outline" title="大纲">☰</button>
        <button id="btn-sidebar" title="侧边栏">📑</button>
        <button id="btn-customcss" title="自定义 CSS">⚙</button>
        <button id="btn-mode" title="切换源码/渲染模式">📝</button>
        <button id="btn-git" title="Git 面板 (Ctrl+Shift+G)">⎇</button>
        <button id="btn-graph" title="文档图谱">🕸</button>
        <button id="btn-publish" title="一键发布">📤</button>
      </div>
    </div>

    <!-- 格式工具栏（可收缩） -->
    <div id="format-toolbar" class="format-toolbar">
      <button class="ft-btn" data-fmt="bold" title="加粗 Ctrl+B"><b>B</b></button>
      <button class="ft-btn" data-fmt="italic" title="斜体 Ctrl+I"><i>I</i></button>
      <button class="ft-btn" data-fmt="strike" title="删除线"><s>S</s></button>
      <button class="ft-btn" data-fmt="code" title="行内代码">&lt;/&gt;</button>
      <span class="ft-sep"></span>
      <button class="ft-btn" data-fmt="h1" title="一级标题">H1</button>
      <button class="ft-btn" data-fmt="h2" title="二级标题">H2</button>
      <button class="ft-btn" data-fmt="h3" title="三级标题">H3</button>
      <button class="ft-btn" data-fmt="h4" title="四级标题">H4</button>
      <span class="ft-sep"></span>
      <button class="ft-btn" data-fmt="ul" title="无序列表">• </button>
      <button class="ft-btn" data-fmt="ol" title="有序列表">1.</button>
      <button class="ft-btn" data-fmt="task" title="任务列表">☑</button>
      <button class="ft-btn" data-fmt="quote" title="引用">❝</button>
      <span class="ft-sep"></span>
      <button class="ft-btn" data-fmt="link" title="链接 🔗">🔗</button>
      <button class="ft-btn" data-fmt="image" title="图片 🖼">🖼</button>
      <button class="ft-btn" data-fmt="table" title="表格">▦</button>
      <button class="ft-btn" data-fmt="hr" title="分隔线">―</button>
      <button class="ft-btn" data-fmt="codeblock" title="代码块">{ }</button>
      <button class="ft-btn" data-fmt="math" title="数学公式">∑</button>
      <span class="ft-sep"></span>
      <button class="ft-btn" data-fmt="mermaid" title="Mermaid 图表">📊</button>
      <button class="ft-toggle" id="toolbar-toggle" title="收起工具栏">▾</button>
    </div>

    <div id="main">
      <!-- 文件树侧边栏 -->
      <div id="sidebar">
        <div class="sidebar-header">
          <span>文件</span>
        </div>
        <div id="file-tree"></div>
      </div>

      <!-- 标签页 -->
      <div id="tab-bar"></div>

      <!-- 编辑区 -->
      <div id="editor-container">
        <div id="editor" contenteditable="true" spellcheck="false"></div>
      </div>

      <!-- 大纲面板 -->
      <div id="outline">
        <div class="sidebar-header">
          <span>大纲</span>
        </div>
        <div id="outline-list"></div>
      </div>
    </div>

    <!-- 右键上下文菜单 -->
    <div id="ctx-menu" class="ctx-menu hidden">
      <div class="ctx-group-title">格式</div>
      <div class="ctx-item" data-action="fmt-bold"><b>加粗</b></div>
      <div class="ctx-item" data-action="fmt-italic"><i>斜体</i></div>
      <div class="ctx-item" data-action="fmt-strike"><s>删除线</s></div>
      <div class="ctx-item" data-action="fmt-code">行内代码</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" data-action="fmt-h1">一级标题</div>
      <div class="ctx-item" data-action="fmt-h2">二级标题</div>
      <div class="ctx-item" data-action="fmt-h3">三级标题</div>
      <div class="ctx-item" data-action="fmt-quote">引用</div>
      <div class="ctx-item" data-action="fmt-ul">无序列表</div>
      <div class="ctx-item" data-action="fmt-ol">有序列表</div>
      <div class="ctx-item" data-action="fmt-task">任务列表</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" data-action="copy-html">复制为 HTML</div>
      <div class="ctx-item" data-action="copy-text">复制为纯文本</div>
      <div class="ctx-item" data-action="copy-md">复制 Markdown 源码</div>
    </div>

    <!-- 全局搜索面板 -->
    <div id="search-panel" class="search-panel hidden">
      <div class="search-header">
        <input type="text" id="search-input" placeholder="在工作区搜索内容（支持正则）..." />
        <label class="search-regex"><input type="checkbox" id="search-use-regex" /> 正则</label>
        <button id="search-close" class="search-close">✕</button>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>

    <!-- 自定义 CSS 弹窗 -->
    <div id="css-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <span>自定义 CSS（覆盖默认渲染样式）</span>
          <button id="css-close" class="search-close">✕</button>
        </div>
        <textarea id="css-editor" class="css-textarea" placeholder="#editor h1 { color: red; }&#10;#editor p { font-size: 18px; }" spellcheck="false"></textarea>
        <div class="modal-footer">
          <button id="css-reset" class="modal-btn">重置</button>
          <button id="css-apply" class="modal-btn primary">应用</button>
        </div>
      </div>
    </div>

    <!-- Git 面板 -->
    <div id="git-panel" class="search-panel hidden">
      <div class="search-header">
        <span id="git-branch" class="git-branch-label">分支: -</span>
        <button id="git-refresh" class="modal-btn" style="padding:4px 8px;font-size:12px">刷新</button>
        <button id="git-close" class="search-close">✕</button>
      </div>
      <div class="git-section-title">变更文件</div>
      <div id="git-files" class="git-files"></div>
      <div class="git-section-title">提交信息</div>
      <textarea id="git-message" class="git-message" placeholder="提交信息..."></textarea>
      <div class="git-actions">
        <button id="git-stage-all" class="modal-btn">全部暂存</button>
        <button id="git-commit-btn" class="modal-btn">提交</button>
        <button id="git-push-btn" class="modal-btn primary">推送</button>
      </div>
      <div class="git-section-title">仓库配置</div>
      <div class="git-config">
        <input type="text" id="git-remote-url" class="git-remote-input" placeholder="远程仓库 URL（如 https://github.com/user/repo.git）" />
        <button id="git-save-remote" class="modal-btn" style="padding:4px 10px;font-size:12px">设置</button>
        <button id="git-init-btn" class="modal-btn" style="padding:4px 10px;font-size:12px">初始化</button>
      </div>
      <div class="git-section-title">最近提交</div>
      <div id="git-log" class="git-log"></div>
    </div>

    <!-- 文档关系图谱弹窗 -->
    <div id="graph-modal" class="modal hidden">
      <div class="modal-content" style="width:760px">
        <div class="modal-header">
          <span>文档关系图谱（[[双向链接]]）</span>
          <button id="graph-close" class="search-close">✕</button>
        </div>
        <div style="position:relative;height:480px;padding:8px">
          <svg id="graph-svg" width="100%" height="100%"></svg>
          <div id="graph-empty" class="search-empty" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">无文档或无双向链接</div>
        </div>
      </div>
    </div>

    <!-- 状态栏 -->
    <div id="statusbar">
      <span id="status-info">就绪</span>
      <span id="status-stats">0 字 · 0 词</span>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
